name: Build Release APK

on:
  push:
    branches: [ main, master, stable-version ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: yaddasht-release
          path: app/build/outputs/apk/release/*.apk
          permissions:
  contents: write

# ... بقیهٔ فایل همان بماند ...

      - name: Copy APK into repo
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/release/app-release.apk apk/app-release.apk

      - name: Commit and push APK
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add apk/app-release.apk
          git commit -m "update apk" || echo "no changes"
          git push
